<!DOCTYPE html>
<html>
<head>
  <title>Secure File Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>🔐 Secure File Upload & Download</h2>
  <a href="{{ url_for('upload') }}">Upload New File</a>
  <h3>Available Files:</h3>
  <ul>
    {% for file in files %}
      <li><a href="{{ url_for('download', filename=file) }}">{{ file }}</a></li>
    {% else %}
      <p>No files uploaded yet.</p>
    {% endfor %}
  </ul>
</body>
</html>
