<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🔐 Download Files</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>📥 Secure File Downloads</h2>

    <h3>Available Encrypted Files:</h3>
    <ul>
        {% for file in files %}
            <li>
                <a href="{{ url_for('download', filename=file) }}">{{ file }}</a>
            </li>
        {% else %}
            <p>No files uploaded yet.</p>
        {% endfor %}
    </ul>

    <hr>

    <h3>Download AES Encryption Key (for demo)</h3>
    <p><em>⚠️ Only for demonstration — do not expose in real systems.</em></p>
    <a href="{{ url_for('download_key') }}">
        <button>Download Secret Key 🔑</button>
    </a>

    <br><br>
    <a href="{{ url_for('index') }}">⬅ Back to Home</a>
</body>
</html>
